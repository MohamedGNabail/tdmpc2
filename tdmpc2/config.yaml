defaults:
    - override hydra/launcher: submitit_local

# environment
task: hopper-hop
obs: state
episodic: false

# evaluation
checkpoint: /mnt/tdmpc2/checkpoints/basketball/sparse
eval_episodes: 10
eval_freq: 5000

# training
steps: 1000000
batch_size: 256
reward_coef: 0.1
value_coef: 0.1
termination_coef: 1
consistency_coef: 20
rho: 0.5
lr: 3e-4
enc_lr_scale: 0.3
grad_clip_norm: 20
tau: 0.01
discount_denom: 5
discount_min: 0.95
discount_max: 0.995
buffer_size: 1_000_000
exp_name: feedback_20000_h_4
data_dir: ???

# planning
mpc: true
iterations: 6
num_samples: 512
num_elites: 64
num_pi_trajs: 24
horizon: 3
min_std: 0.05
max_std: 2
temperature: 0.5

# actor
log_std_min: -10
log_std_max: 2
entropy_coef: 1e-4

# critic
num_bins: 101
vmin: -10
vmax: +10

# architecture
model_size: 5
num_enc_layers: 2
enc_dim: 256
num_channels: 32
mlp_dim: 512
mlp_reward_dim: 255
latent_dim: 512
task_dim: 96
num_q: 5
num_r_d: 5
dropout: 0.01
simnorm_dim: 8

# Polyak coefficient for target policy
polyak_tau: 0.005  


# logging
wandb_project: UBP2_PREF
wandb_entity: mohamednabail_leaf
wandb_silent: false
enable_wandb: true #default true
save_csv: true

# misc
compile: false
save_video: false #default true
save_agent: true
seed: 1
#device
cuda_device: cuda:0


# convenience
work_dir: ???
task_title: ???
multitask: false
tasks: hopper-hop
obs_shape: ???
action_dim: ???
episode_length: ???
obs_shapes: ???
action_dims: ???
episode_lengths: ???
seed_steps: ???
bin_size: ???


#pref leanring 
max_pref_feedback: 20000 
pref_update_freq: 1000
num_pref_sampled: 20 #for max_pref_feedback of 5000 : 5 , for max_pref_feedback of 10000 : 10 , for max_pref_feedback of 20000 : 20 

#planning w uncertainty
rew_uncer_alpha_coef: 1 #default is 1
dyn_uncer_beta_coef: 1 #default is 1 

pref_learn: true
optimistic_pref_sampling: true
evaluate_w_uncer: false
planning_criteria: total_value #default is total_value, don't use ubp_reward it is wrong as tested before
uncertainity_rep: JRD
#change seed, cuda device, in code change eval mode == false or true in estimate_uncertainty , q uncerterinty coef & plan_mean_std 


