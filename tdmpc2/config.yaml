defaults:
    - override hydra/launcher: submitit_local

# environment
task: mw-coffee-push
obs: state
episodic: false

# evaluation
checkpoint: ???
eval_episodes: 10
eval_freq: 10000

# training
steps: 10_000_000
batch_size: 256
reward_coef: 0.1
value_coef: 0.1
termination_coef: 1
consistency_coef: 20
rho: 0.5
lr: 3e-4
enc_lr_scale: 0.3
grad_clip_norm: 20
tau: 0.01
discount_denom: 5
discount_min: 0.95
discount_max: 0.995
buffer_size: 1_000_000
exp_name: pref_learning
data_dir: /data/tdmpc2

# planning
mpc: true
iterations: 6
num_samples: 512
num_elites: 64
num_pi_trajs: 24
horizon: 3
min_std: 0.05
max_std: 2
temperature: 0.5

# actor
log_std_min: -10
log_std_max: 2
entropy_coef: 1e-4

# critic
num_bins: 101
vmin: -10
vmax: +10

# prefernce based reward
pref_segment: 50
pref_activation: relu
pref_reward_lr: 0.001
pref_reward_batch: 128
pref_large_batch: 10
pref_label_margin: 0.0
pref_teacher_beta: -1
pref_teacher_gamma: 1
pref_teacher_eps_mistake: 0
pref_teacher_eps_skip: 0
pref_teacher_eps_equal: 0
pref_capacity: 5e5
pref_feed_type: 0
pref_reward_update: 200

# architecture
model_size: 5
num_enc_layers: 2
enc_dim: 256
num_channels: 32
mlp_dim: 512
mlp_reward_dim: 255
latent_dim: 512
task_dim: 96
num_q: 5
num_r: 5
num_d: 5
dropout: 0.01
simnorm_dim: 8

# logging
wandb_project: TDMPC2
wandb_entity: mohamednabail_leaf
wandb_silent: false
enable_wandb: true
save_csv: true

# misc
compile: true
save_video: true
save_agent: true
seed: 1

# convenience
work_dir: ???
task_title: ???
multitask: false
tasks: coffee-push
obs_shape: 39
action_dim: 4
episode_length: 200
obs_shapes: ???
action_dims: ???
episode_lengths: ???
seed_steps: ???
bin_size: ???

#device 
cuda_device: cuda:1

#planning w uncertainty
rew_uncer_beta_coef: 0
dyn_uncer_alpha_coef: 0
evaluate_w_uncer: false